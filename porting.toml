findings = ["No UniXNU Mali CSF component exists (the org's GPU components are Adreno-only); a MaliCsf XNU driver is a new component, not an adaptation.", "The GPU hands over powered from the ABL splash; a fixed 151 MHz stub clock was sufficient for bring-up on Linux (no ACPM/DVFS/power-domain control needed at first light)."]
completion = ["GPU submissions complete, mapping/fence handling is correct, a known image renders, and the selected Metal client presents it."]
