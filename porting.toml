[[area]]
id = "gpu"
status = "planned"
components = []
paths = ["package/*Gpu*", "scripts/*gpu*", "scripts/*metal*"]
inputs = ["Mali G710 MC10, Valhall arch 10.8 CSF: reg 0x28000000/0x480000, IRQs SPI 329 (job) / 330 (mmu) / 328 (gpu), compatible google,gs201-mali + arm,mali-valhall-csf.", "Firmware: linux-firmware arm/mali/arch10.8/mali_csffw.bin (Redistributable, Arm EULA). The device's own /vendor mali_csffw-r54p3.bin is kbase-ABI and incompatible.", "DVFS: ACPM mailbox 0x18210000, SRAM 0x18500000, IDs 0x0B040005 (G3D) / 0x0B040006 (G3DL2); 151 MHz stub clock ran GLES+Vulkan on panther before DVFS.", "EL3 hazards: PMU G3D registers 0x18061e00-0x18062010 crash the SoC on an NS read; never touch CMU_G3D PLLs (ACPM owns them) or GLOBAL_CON/SRESET while owning the splash."]
configuration = ["gpu node disabled in gs201.dtsi with verified addresses and interrupts; firmware listed in proprietary-files.txt pending hash."]
